<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Registration Form (VRF)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url('profile company growsmart (2).png');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="py-10 px-4 sm:px-6 lg:px-8">

  <div class="max-w-3xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-yellow-400 overflow-hidden my-6">
    
    <div class="w-full bg-white leading-none">
      <img src="header.png" alt="Header VRF" class="w-full h-auto object-contain block">
    </div>

    <!-- PENTING: Borang menghantar terus data ke Google Apps Script -->
    <form action="https://script.google.com/macros/s/AKfycbyCLUCuBhSKkLon5hbJntAGIyLOUf2fzo4ovs_tfK8lwuVWyY8GSk3_ztf7Jf0W_w5N/exec" method="POST" class="p-6 md:p-8 space-y-8">

      <!-- 1. PARENT / GUARDIAN INFORMATION -->
      <div class="space-y-5">
        <div class="bg-yellow-100 border-l-8 border-yellow-500 p-4 rounded-r-xl shadow-sm flex items-center gap-3">
          <span class="text-2xl">👨‍👩‍👧</span>
          <div>
            <h2 class="text-lg md:text-xl font-bold text-gray-800 uppercase">1. PARENT / GUARDIAN INFORMATION</h2>
            <p class="text-xs md:text-sm text-gray-600 font-medium">MAKLUMAT IBU BAPA / PENJAGA</p>
          </div>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-gray-800 font-bold">Parent / Guardian Name <span class="text-red-500">*</span></label>
            <input type="text" name="namaPenjaga" required placeholder="Masukkan nama penuh" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
          </div>

          <div>
            <label class="block text-gray-800 font-bold">Relationship <span class="text-red-500">*</span></label>
            <input type="text" name="hubungan" required placeholder="Contoh: Bapa / Ibu" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
          </div>

          <div>
            <label class="block text-gray-800 font-bold">Home Address <span class="text-red-500">*</span></label>
            <textarea name="alamat" rows="2" required placeholder="Masukkan alamat lengkap" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none"></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-gray-800 font-bold">Father's Occupation</label>
              <input type="text" name="pekerjaanBapa" placeholder="Pekerjaan Bapa" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
            </div>
            <div>
              <label class="block text-gray-800 font-bold">Father's Phone No.</label>
              <input type="tel" name="telBapa" placeholder="No. Telefon Bapa" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-gray-800 font-bold">Mother's Occupation</label>
              <input type="text" name="pekerjaanIbu" placeholder="Pekerjaan Ibu" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
            </div>
            <div>
              <label class="block text-gray-800 font-bold">Mother's Phone No.</label>
              <input type="tel" name="telIbu" placeholder="No. Telefon Ibu" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
            </div>
          </div>
        </div>
      </div>

      <!-- 2. CHILD INFORMATION -->
      <div class="space-y-5">
        <div class="bg-yellow-100 border-l-8 border-yellow-500 p-4 rounded-r-xl shadow-sm flex items-center gap-3">
          <span class="text-2xl">👶</span>
          <div>
            <h2 class="text-lg md:text-xl font-bold text-gray-800 uppercase">2. CHILD INFORMATION</h2>
            <p class="text-xs md:text-sm text-gray-600 font-medium">MAKLUMAT ANAK</p>
          </div>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-gray-800 font-bold">Child Name <span class="text-red-500">*</span></label>
            <input type="text" name="namaAnak" required placeholder="Nama penuh anak" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-gray-800 font-bold">Age <span class="text-red-500">*</span></label>
              <input type="text" name="umurAnak" required placeholder="Contoh: 5 Tahun" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
            </div>
            <div>
              <label class="block text-gray-800 font-bold">Date of Birth <span class="text-red-500">*</span></label>
              <input type="date" name="tarikhLahirAnak" required class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-gray-800 font-bold">Current School / Kindergarten</label>
            <input type="text" name="sekolahTerkini" placeholder="Sekolah / Tadika" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
          </div>

          <div>
            <label class="block text-gray-800 font-bold">SYMPTOM (OPTION)</label>
            <select name="simptom" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 bg-white focus:border-yellow-500 outline-none">
              <option value="">-- Pilih Simptom --</option>
              <option value="Limited eye contact">Limited eye contact</option>
              <option value="Focus issue">Focus issue</option>
              <option value="Delayed speech">Delayed speech</option>
              <option value="Social communication">Social communication</option>
              <option value="Social interaction">Social interaction</option>
              <option value="Challenging behaviour">Challenging behaviour</option>
              <option value="Sensory differences">Sensory differences</option>
              <option value="Hyperactive">Hyperactive</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-800 font-bold">DIAGNOSIS (OPTION)</label>
            <select name="diagnos" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 bg-white focus:border-yellow-500 outline-none">
              <option value="">-- Pilih Diagnos --</option>
              <option value="ADHD">ADHD</option>
              <option value="DYSLEXIA">DYSLEXIA</option>
              <option value="GDD">GDD</option>
              <option value="SPEECH DELAY">SPEECH DELAY</option>
              <option value="DOWN SYNDROME">DOWN SYNDROME</option>
              <option value="AUTISM">AUTISM</option>
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-gray-800 font-bold">ATTEND THERAPY?</label>
              <select name="pergiTerapi" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 bg-white focus:border-yellow-500 outline-none">
                <option value="NO / TIDAK">NO / TIDAK</option>
                <option value="YES / YA">YES / YA</option>
              </select>
            </div>
            <div>
              <label class="block text-gray-800 font-bold">OKU CARD</label>
              <select name="kadOku" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 bg-white focus:border-yellow-500 outline-none">
                <option value="NO / TIADA">NO / TIADA</option>
                <option value="YES / ADA">YES / ADA</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-gray-800 font-bold">WHERE? (IF YES)</label>
            <input type="text" name="tempatTerapi" placeholder="Lokasi terapi" class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 focus:border-yellow-500 outline-none">
          </div>
        </div>
      </div>

      <!-- 3. PACKAGE & SOURCE INFORMATION -->
      <div class="space-y-5">
        <div class="bg-yellow-100 border-l-8 border-yellow-500 p-4 rounded-r-xl shadow-sm flex items-center gap-3">
          <span class="text-2xl">📋</span>
          <div>
            <h2 class="text-lg md:text-xl font-bold text-gray-800 uppercase">3. PACKAGE & SOURCE INFORMATION</h2>
            <p class="text-xs md:text-sm text-gray-600 font-medium">PAKEJ & MAKLUMAT INFO</p>
          </div>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-gray-800 font-bold">INTERESTED PACKAGE <span class="text-red-500">*</span></label>
            <select name="pakej" required class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 bg-white focus:border-yellow-500 outline-none">
              <option value="" disabled selected>-- Pilih Pakej --</option>
              <option value="DAYCARE HALF-DAY">DAYCARE HALF-DAY</option>
              <option value="DAYCARE FULL-DAY">DAYCARE FULL-DAY</option>
              <option value="DAYCARE PER-DAY">DAYCARE PER-DAY</option>
              <option value="PROGRAM THERAPY (OT)">PROGRAM THERAPY (OT)</option>
              <option value="PROGRAM TISO">PROGRAM TISO</option>
              <option value="PROGRAM GSP">PROGRAM GSP</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-800 font-bold">How did you hear about our centre? <span class="text-red-500">*</span></label>
            <select name="infoCentre" required class="mt-1 w-full p-3 rounded-xl border-2 border-gray-200 bg-white focus:border-yellow-500 outline-none">
              <option value="" disabled selected>-- Pilih Sumber --</option>
              <option value="Facebook">Facebook</option>
              <option value="TikTok">TikTok</option>
              <option value="Instagram">Instagram</option>
              <option value="Google Search">Google Search</option>
              <option value="Friends / Family Referral">Friends / Family Referral</option>
              <option value="Walk-in">Walk-in</option>
            </select>
          </div>
        </div>
      </div>

      <!-- BUTTON SUBMIT -->
      <div class="pt-6 text-center">
        <button type="submit" class="w-full py-4 px-8 bg-yellow-400 hover:bg-yellow-500 text-red-800 font-black text-lg md:text-xl rounded-2xl shadow-xl uppercase tracking-wider">
          SUBMIT PENDAFTARAN
        </button>
      </div>

    </form>
  </div>

</body>
</html>
