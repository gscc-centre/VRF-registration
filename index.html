<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Registration Form (VRF)</title>
    <style>
        :root {
            --primary-color: #8b7355;
            --bg-color: #f5f2eb;
            --card-bg: #d4af37;
            --text-color: #ffffff;
            --input-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-color); padding: 15px; display: flex; justify-content: center; }
        .vrf-container { background: #b89700; color: white; max-width: 500px; width: 100%; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        h1 { text-align: center; font-size: 20px; margin-bottom: 15px; text-transform: uppercase; border-bottom: 2px dashed #fff; padding-bottom: 10px; }
        h2 { font-size: 15px; margin: 15px 0 10px 0; text-transform: uppercase; background: rgba(0,0,0,0.1); padding: 5px; border-radius: 4px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #333; }
        .btn-submit { width: 100%; background: #2b2b2b; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn-submit:disabled { background: #777; }
    </style>
</head>
<body>

<div class="vrf-container">
    <h1>VISITOR REGISTRATION FORM (VRF)</h1>

    <form id="vrfForm" onsubmit="handleVRFSubmit(event)">
        <!-- 1. PARENT / GUARDIAN INFORMATION -->
        <h2>1. PARENT / GUARDIAN INFORMATION</h2>
        <div class="form-group">
            <label>Parent Name *</label>
            <input type="text" id="parentName" required>
        </div>
        <div class="form-group">
            <label>Relationship *</label>
            <input type="text" id="relationship" placeholder="e.g. Mother / Father" required>
        </div>
        <div class="form-group">
            <label>Address *</label>
            <textarea id="address" rows="2" required></textarea>
        </div>
        <div class="form-group">
            <label>Father Occupation & Phone</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="fatherOccupation" placeholder="Occupation">
                <input type="tel" id="fatherPhone" placeholder="Phone">
            </div>
        </div>
        <div class="form-group">
            <label>Mother Occupation & Phone</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="motherOccupation" placeholder="Occupation">
                <input type="tel" id="motherPhone" placeholder="Phone">
            </div>
        </div>

        <!-- 2. CHILD INFORMATION -->
        <h2>2. CHILD INFORMATION</h2>
        <div class="form-group">
            <label>Child Name *</label>
            <input type="text" id="childName" required>
        </div>
        <div class="form-group">
            <label>Age & Date of Birth *</label>
            <div style="display: flex; gap: 5px;">
                <input type="number" id="age" placeholder="Age" style="width: 30%;" required>
                <input type="date" id="dob" style="width: 70%;" required>
            </div>
        </div>
        <div class="form-group">
            <label>Current School</label>
            <input type="text" id="school">
        </div>
        <div class="form-group">
            <label>Symptom</label>
            <input type="text" id="symptom" placeholder="e.g. Speech delay, Limited eye contact">
        </div>
        <div class="form-group">
            <label>Diagnosis</label>
            <input type="text" id="diagnosis" placeholder="e.g. Autism, ADHD, None">
        </div>
        <div class="form-group">
            <label>Attending Therapy Before?</label>
            <select id="attendTherapy">
                <option value="NO / TIDAK">NO / TIDAK</option>
                <option value="YES / YA">YES / YA</option>
            </select>
        </div>
        <div class="form-group">
            <label>Therapy Location (If YES)</label>
            <input type="text" id="therapyLocation">
        </div>
        <div class="form-group">
            <label>OKU Card</label>
            <select id="okuCard">
                <option value="TIADA / NO">TIADA / NO</option>
                <option value="ADA / YES">ADA / YES</option>
            </select>
        </div>

        <!-- 3. PACKAGE & SOURCE -->
        <h2>3. PACKAGE & SOURCE</h2>
        <div class="form-group">
            <label>Interested Package *</label>
            <input type="text" id="package" placeholder="e.g. DAYCARE HALF-DAY / OT SESSION" required>
        </div>
        <div class="form-group">
            <label>Heard From *</label>
            <select id="heardFrom">
                <option value="TikTok">TikTok</option>
                <option value="Facebook">Facebook</option>
                <option value="Instagram">Instagram</option>
                <option value="Friends / Family">Friends / Family</option>
                <option value="Banner / Flyway">Banner / Flyway</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">SUBMIT REGISTRATION 🚀</button>
    </form>
</div>

<script>
    // URL WEB APP TERBAHARU ANDA
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzGfk-XvkcFJOJtTAZOC-Mk2a9YoPt-qQvJyEGewiEv5G3iSCTt07DODiU2lIF3zPJ6og/exec";
    const ADMIN_WHATSAPP = "60123422557"; 

    function handleVRFSubmit(event) {
        event.preventDefault();
        const btn = document.querySelector('.btn-submit');
        btn.innerText = "Submitting Data... ⏳";
        btn.disabled = true;

        const formData = {
            'parentName': document.getElementById('parentName').value,
            'relationship': document.getElementById('relationship').value,
            'address': document.getElementById('address').value,
            'fatherOccupation': document.getElementById('fatherOccupation').value,
            'fatherPhone': document.getElementById('fatherPhone').value,
            'motherOccupation': document.getElementById('motherOccupation').value,
            'motherPhone': document.getElementById('motherPhone').value,
            'childName': document.getElementById('childName').value,
            'age': document.getElementById('age').value,
            'dob': document.getElementById('dob').value,
            'school': document.getElementById('school').value,
            'symptom': document.getElementById('symptom').value,
            'diagnosis': document.getElementById('diagnosis').value,
            'attendTherapy': document.getElementById('attendTherapy').value,
            'therapyLocation': document.getElementById('therapyLocation').value,
            'okuCard': document.getElementById('okuCard').value,
            'package': document.getElementById('package').value,
            'heardFrom': document.getElementById('heardFrom').value
        };

        var searchParams = new URLSearchParams();
        for (var key in formData) {
            searchParams.append(key, formData[key]);
        }

        // Hantar Data ke Google Sheets & Emel
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: searchParams,
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        })
        .then(() => { hantarKeWhatsApp(formData); })
        .catch(() => { hantarKeWhatsApp(formData); });
    }

    function hantarKeWhatsApp(data) {
        const mesejWA = `*VISITOR REGISTRATION FORM (VRF)*%0A-----------------------------------%0A%0A*1. PARENT / GUARDIAN INFORMATION*%0A• Name: ${data.parentName}%0A• Relationship: ${data.relationship}%0A• Address: ${data.address}%0A• Father: ${data.fatherOccupation} (${data.fatherPhone})%0A• Mother: ${data.motherOccupation} (${data.motherPhone})%0A%0A*2. CHILD INFORMATION*%0A• Name: ${data.childName}%0A• Age: ${data.age}%0A• DOB: ${data.dob}%0A• School: ${data.school}%0A• Symptom: ${data.symptom}%0A• Diagnosis: ${data.diagnosis}%0A• Therapy: ${data.attendTherapy} (Where: ${data.therapyLocation})%0A• OKU Card: ${data.okuCard}%0A%0A*3. PACKAGE & SOURCE*%0A• Package Interested: ${data.package}%0A• Heard From: ${data.heardFrom}`;

        alert("Pendaftaran Berjaya! Sila tekan OK untuk menghantar ringkasan ke WhatsApp Admin.");
        window.location.href = `https://wa.me/${ADMIN_WHATSAPP}?text=${mesejWA}`;
    }
</script>

</body>
</html>
